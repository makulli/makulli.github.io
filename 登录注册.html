<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录注册 · 中登写日报</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F7F6F3'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%23192930'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--bg-2:#F7F6F3;--bg-3:#FCFBF9;--panel:#FFFFFF;
  --line:rgba(25,41,48,.10);--line-strong:rgba(25,41,48,.22);
  --ink:#192930;--muted:#5C6670;--faint:#8B9399;
  --accent:#155A93;--accent-soft:rgba(21,90,147,.08);
  --ok:#1E8E5A;--danger:#B3402F;--wx:#07C160;
  --font-serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --font-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --radius:12px;--shadow:0 16px 40px rgba(25,41,48,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input{font-family:inherit;color:inherit}
::selection{background:var(--accent-soft)}
h1,h2,h3{font-family:var(--font-serif)}

.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{height:64px;max-width:1120px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{font-family:var(--font-serif);font-size:19px;font-weight:700;color:var(--ink);transition:color .2s}
.brand:hover{color:var(--accent)}
.nav-l{display:flex;align-items:center;gap:18px;font-size:13.5px;color:var(--faint)}
.nav-l a:hover{color:var(--accent)}

.auth-wrap{max-width:520px;margin:0 auto;padding:128px 24px 60px}
.auth-card{border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);padding:34px 34px 30px}
.auth-head{text-align:center;margin-bottom:24px}
.auth-head h1{font-size:23px;font-weight:900}
.auth-head p{font-size:13.5px;color:var(--faint);margin-top:6px}

.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:24px;gap:4px}
.tab{flex:1;padding:11px 0;font-size:15px;font-weight:600;color:var(--faint);text-align:center;position:relative;transition:color .2s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent)}
.tab.on::after{content:"";position:absolute;left:20%;right:20%;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.pane{display:none}
.pane.on{display:block}
.pane-foot{text-align:center;font-size:13px;color:var(--faint);margin-top:18px}
.pane-foot a{color:var(--accent);font-weight:600}
.pane-foot a:hover{text-decoration:underline}

.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field label{font-size:13.5px;color:var(--muted);font-weight:600}
.field input{background:var(--bg);border:1px solid var(--line-strong);border-radius:10px;padding:12px 14px;font-size:15px;transition:border-color .2s;width:100%}
.field input:focus{outline:none;border-color:var(--accent)}
.hint{font-size:12px;color:var(--faint)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 20px;border-radius:10px;font-size:15px;font-weight:700;transition:transform .18s,box-shadow .18s,background .18s;margin-top:6px}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none}
.btn-primary{background:var(--ink);color:#fff;box-shadow:0 8px 20px rgba(25,41,48,.16)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(25,41,48,.22);background:#0E1519}
.btn-ghost{border:1px solid var(--line-strong);color:var(--ink);background:var(--bg)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn-wx{background:var(--wx);color:#fff;box-shadow:0 8px 20px rgba(7,193,96,.2);cursor:not-allowed;opacity:.55}
.divider{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px;margin:20px 0 16px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

/* 账号卡 */
.acct-card{text-align:center}
.acct-avatar{width:76px;height:76px;border-radius:50%;margin:0 auto 16px;background:var(--accent-soft);border:1px solid rgba(21,90,147,.25);display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:30px;font-weight:700;color:var(--accent)}
.acct-card h2{font-size:21px;font-weight:900}
.acct-card .a-phone{font-size:13.5px;color:var(--muted);margin-top:4px}
.acct-binds{display:flex;justify-content:center;gap:10px;margin:18px 0 4px;flex-wrap:wrap}
.bind-chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.bind-chip.done{color:var(--ok);border-color:rgba(30,142,90,.4);background:rgba(30,142,90,.06)}
.bind-chip svg{width:14px;height:14px;stroke:currentColor;fill:none}
.acct-actions{display:flex;gap:10px;margin-top:22px}
.acct-actions .btn{flex:1;margin-top:0}
.acct-note{font-size:12px;color:var(--faint);margin-top:18px}

.demo-note{margin-top:18px;font-size:12px;color:var(--faint);text-align:center;line-height:1.7}
.err{background:rgba(179,64,47,.07);border:1px solid rgba(179,64,47,.35);color:var(--danger);font-size:13px;border-radius:10px;padding:10px 14px;margin-bottom:14px;display:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,80px);z-index:300;background:rgba(25,41,48,.95);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;box-shadow:0 16px 40px rgba(25,41,48,.2);opacity:0;pointer-events:none;transition:transform .3s,opacity .3s;max-width:88vw;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
@media (max-width:640px){
  .auth-wrap{padding:104px 16px 48px}
  .auth-card{padding:26px 20px 24px}
  .field input{font-size:16px}
}
</style>
</head>
<body>

<!-- ================= 顶部导航 ================= -->
<header class="nav">
  <div class="nav-in">
    <a class="brand" href="中登写日报-博客.html">中登写日报</a>
    <div class="nav-l">
      <a href="中登写日报-博客.html">返回网站</a>
      <a href="发布后台.html">发布后台</a>
    </div>
  </div>
</header>

<main class="auth-wrap">

  <!-- 已登录：账号卡 -->
  <div class="auth-card acct-card" id="acctCard" style="display:none">
    <div class="acct-avatar" id="acctInitial">登</div>
    <h2 id="acctName">欢迎回来</h2>
    <p class="a-phone" id="acctPhone"></p>
    <div class="acct-binds" id="acctBinds"></div>
    <div class="acct-actions">
      <button class="btn btn-primary" id="goAdminBtn">进入发布后台</button>
      <button class="btn btn-ghost" id="logoutBtn2">退出登录</button>
    </div>
    <p class="acct-note">账号已接入 Supabase 数据库，可在任意设备登录。</p>
  </div>

  <!-- 登录 / 注册 -->
  <div class="auth-card" id="authCard">
    <div class="auth-head">
      <h1>登录 / 注册</h1>
      <p>邮箱注册，数据存入云端数据库</p>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="login" id="tabLogin">登录</button>
      <button class="tab" data-tab="register" id="tabRegister">注册</button>
    </div>
    <div class="err" id="errBox"></div>

    <!-- 登录 -->
    <div class="pane on" id="paneLogin">
      <div class="field">
        <label for="lEmail">邮箱</label>
        <input type="email" id="lEmail" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="lPass">密码</label>
        <input type="password" id="lPass" placeholder="请输入密码">
      </div>
      <button class="btn btn-primary" id="loginBtn">登录</button>
      <p class="pane-foot">还没有账号？<a href="#" id="toRegisterLink">去注册</a></p>
    </div>

    <!-- 注册 -->
    <div class="pane" id="paneRegister">
      <div class="field">
        <label for="rName">昵称</label>
        <input type="text" id="rName" maxlength="16" placeholder="怎么称呼你">
      </div>
      <div class="field">
        <label for="rEmail">邮箱</label>
        <input type="email" id="rEmail" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="rPass">密码</label>
        <input type="password" id="rPass" placeholder="至少 6 位">
      </div>
      <div class="field">
        <label for="rPass2">确认密码</label>
        <input type="password" id="rPass2" placeholder="再次输入密码">
      </div>
      <div class="field">
        <label for="rPhone">手机号（可选，用于账号关联展示）</label>
        <input type="tel" id="rPhone" maxlength="11" placeholder="11 位手机号">
      </div>
      <button class="btn btn-primary" id="registerBtn">注册并登录</button>
      <p class="pane-foot">注册即创建 Supabase 云端账号；若开启邮箱验证，需先到邮箱点确认链接</p>
    </div>

    <div class="divider">其他登录方式</div>
    <button class="btn btn-wx" id="wxBtn">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M9.3 4C5.4 4 2.2 6.5 2.2 9.6c0 1.8 1.1 3.4 2.7 4.5l-.7 2.1c-.1.2.1.4.3.3l2.4-1.4c.7.2 1.5.3 2.4.3 1 0 1.9-.1 2.7-.4-.2-.6-.3-1.2-.3-1.9 0-3.2 3.2-5.9 7.1-5.9h.4C18.5 6 14.4 4 9.3 4zM6.6 8.2c-.5 0-.9-.4-.9-.9s.4-.9.9-.9.9.4.9.9-.4.9-.9.9zm5.4 0c-.5 0-.9-.4-.9-.9s.4-.9.9-.9.9.4.9.9-.4.9-.9.9zM21.8 13.7c0-2.6-2.7-4.7-6-4.7s-6 2.1-6 4.7 2.7 4.7 6 4.7c.8 0 1.5-.1 2.2-.3l1.9 1.1c.2.1.3-.1.3-.3l-.5-1.6c1.3-.9 2.1-2.2 2.1-3.6zm-7.6-.5c-.4 0-.7-.3-.7-.7s.3-.7.7-.7.7.3.7.7-.3.7-.7.7zm3.2 0c-.4 0-.7-.3-.7-.7s.3-.7.7-.7.7.3.7.7-.3.7-.7.7z"/></svg>
      微信登录（待接入）
    </button>
  </div>

  <p class="demo-note">已接入 Supabase 云端账号系统，数据真实入库。「微信扫码登录」需微信开放平台企业认证（每年 300 元）后接入；「手机号验证码」需开通短信服务后接入——两者均暂未开放。</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';

/* ★ 上线前替换为你的真实值：Supabase Dashboard → Project Settings → API */
var DB_URL='https://ywdcgqatcqyvlcjyezbn.supabase.co';
var DB_ANON='sb_publishable_cO6EgTPzZcC_GL5QJfmCwQ_Ualgt0r3';
var sb=supabase.createClient(DB_URL,DB_ANON);

function toast(msg){
  var el=document.querySelector('.toast');
  if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el);}
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);
  el._t=setTimeout(function(){el.classList.remove('show');},2600);
}
function showErr(msg){
  var el=document.getElementById('errBox');
  el.style.display=msg?'block':'none';
  el.textContent=msg||'';
}
function getNext(){
  var m=location.search.match(/[?&]next=([^&]+)/);
  if(!m){return null;}
  try{return decodeURIComponent(m[1]);}catch(e){return m[1];}
}
function goNext(){
  var n=getNext();
  if(n){location.href=n;return;}
  location.href='中登写日报-博客.html';
}
function validEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);}

/* ================= 会话与用户资料 ================= */
function getProfile(uid){
  return sb.from('profiles').select('*').eq('id',uid).maybeSingle();
}
function upsertProfile(u){
  var name=(u.user_metadata&&u.user_metadata.name)||'用户';
  var phone=(u.user_metadata&&u.user_metadata.phone)||'';
  return sb.from('profiles').upsert({id:u.id,name:name,phone:phone},{onConflict:'id'});
}
function bindChips(p){
  var c=[];
  c.push('<span class="bind-chip'+(p&&p.email?' done':'')+'"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>邮箱'+(p&&p.email?' 已绑定':' 未绑定')+'</span>');
  c.push('<span class="bind-chip'+(p&&p.phone?' done':'')+'"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>手机号'+(p&&p.phone?' 已关联':' 未关联')+'</span>');
  c.push('<span class="bind-chip'+(p&&p.wx?' done':'')+'"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M9.3 4C5.4 4 2.2 6.5 2.2 9.6c0 1.8 1.1 3.4 2.7 4.5l-.7 2.1c-.1.2.1.4.3.3l2.4-1.4c.7.2 1.5.3 2.4.3 1 0 1.9-.1 2.7-.4-.2-.6-.3-1.2-.3-1.9 0-3.2 3.2-5.9 7.1-5.9h.4C18.5 6 14.4 4 9.3 4zM6.6 8.2c-.5 0-.9-.4-.9-.9s.4-.9.9-.9.9.4.9.9-.4.9-.9.9zm5.4 0c-.5 0-.9-.4-.9-.9s.4-.9.9-.9.9.4.9.9-.4.9-.9.9zM21.8 13.7c0-2.6-2.7-4.7-6-4.7s-6 2.1-6 4.7 2.7 4.7 6 4.7c.8 0 1.5-.1 2.2-.3l1.9 1.1c.2.1.3-.1.3-.3l-.5-1.6c1.3-.9 2.1-2.2 2.1-3.6zm-7.6-.5c-.4 0-.7-.3-.7-.7s.3-.7.7-.7.7.3.7.7-.3.7-.7.7zm3.2 0c-.4 0-.7-.3-.7-.7s.3-.7.7-.7.7.3.7.7-.3.7-.7.7z"/></svg>微信'+(p&&p.wx?' 已关联':' 未关联')+'</span>');
  return c.join('');
}
function render(){
  sb.auth.getSession().then(function(s){
    var u=s.data.session?s.data.session.user:null;
    var acct=document.getElementById('acctCard');
    var auth=document.getElementById('authCard');
    if(u){
      acct.style.display='block';auth.style.display='none';
      document.getElementById('acctInitial').textContent=(u.user_metadata&&u.user_metadata.name?u.user_metadata.name:'用').charAt(0);
      document.getElementById('acctName').textContent=(u.user_metadata&&u.user_metadata.name)||u.email;
      document.getElementById('acctPhone').textContent=u.email||'';
      getProfile(u.id).then(function(res){
        var p=res.data||{email:u.email,phone:(u.user_metadata&&u.user_metadata.phone)||'',wx:''};
        document.getElementById('acctBinds').innerHTML=bindChips(p);
      });
    }else{
      acct.style.display='none';auth.style.display='block';
    }
  });
}

/* ================= 登录 / 注册 ================= */
function login(){
  showErr('');
  var email=document.getElementById('lEmail').value.trim();
  var pass=document.getElementById('lPass').value;
  if(!validEmail(email)){showErr('请输入正确的邮箱地址');return;}
  if(!pass){showErr('请输入密码');return;}
  sb.auth.signInWithPassword({email:email,password:pass}).then(function(res){
    if(res.error){showErr(res.error.message);return;}
    toast('登录成功');
    render();
    goNext();
  });
}
function register(){
  showErr('');
  var name=document.getElementById('rName').value.trim();
  var email=document.getElementById('rEmail').value.trim();
  var pass=document.getElementById('rPass').value;
  var pass2=document.getElementById('rPass2').value;
  var phone=document.getElementById('rPhone').value.trim();
  if(!name){showErr('请填写昵称');return;}
  if(!validEmail(email)){showErr('请输入正确的邮箱地址');return;}
  if(pass.length<6){showErr('密码至少 6 位');return;}
  if(pass!==pass2){showErr('两次输入的密码不一致');return;}
  if(phone&&!/^1\d{10}$/.test(phone)){showErr('手机号格式不正确');return;}
  sb.auth.signUp({
    email:email,password:pass,
    options:{data:{name:name,phone:phone}}
  }).then(function(res){
    if(res.error){showErr(res.error.message);return;}
    if(res.data.session){
      upsertProfile(res.data.session.user).then(function(){});
      toast('注册成功，欢迎 '+name);
      render();
      goNext();
    }else{
      toast('注册成功，请到邮箱点击确认链接后登录');
      switchTab('login');
    }
  });
}

/* ================= 事件绑定 ================= */
function switchTab(t){
  document.getElementById('tabLogin').classList.toggle('on',t==='login');
  document.getElementById('tabRegister').classList.toggle('on',t==='register');
  document.getElementById('paneLogin').classList.toggle('on',t==='login');
  document.getElementById('paneRegister').classList.toggle('on',t==='register');
}
document.getElementById('tabLogin').addEventListener('click',function(){switchTab('login');});
document.getElementById('tabRegister').addEventListener('click',function(){switchTab('register');});
document.getElementById('toRegisterLink').addEventListener('click',function(e){e.preventDefault();switchTab('register');});
document.getElementById('loginBtn').addEventListener('click',login);
document.getElementById('registerBtn').addEventListener('click',register);
document.getElementById('goAdminBtn').addEventListener('click',function(){location.href='发布后台.html';});
document.getElementById('logoutBtn2').addEventListener('click',function(){
  sb.auth.signOut().then(function(){toast('已退出登录');render();});
});
document.getElementById('wxBtn').addEventListener('click',function(){
  toast('微信登录需企业认证后接入，暂未开放');
});

/* ================= 启动 ================= */
render();
})();
</script>
</body>
</html>
